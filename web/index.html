<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online SAMS - Student Attendance Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo">📋</div>
      <h1 class="auth-title">Online Student Attendance Management System</h1>
      <p class="auth-subtitle">Student Attendance Management System</p>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <!-- Role Tabs -->
      <div class="role-tabs" id="roleTabs">
        <button type="button" class="role-tab active" data-role="admin">
          <span>🛡️</span> Admin
        </button>
        <button type="button" class="role-tab" data-role="teacher">
          <span>👨‍🏫</span> Teacher
        </button>
        <button type="button" class="role-tab" data-role="student">
          <span>🎓</span> Student
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <input type="hidden" id="loginRole" value="admin">

        <div class="form-group">
          <label class="form-label" id="usernameLabel" for="username">Admin Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-group">
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            <button type="button" class="toggle-password" id="togglePasswordBtn" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-submit-login" id="submitLoginBtn">
          <span>Sign In</span> <span>➔</span>
        </button>
      </form>

      <!-- Demo Accounts Helper -->
      

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
